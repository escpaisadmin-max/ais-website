name: Drive content sync

# Pulls content from the AIS Google Drive and commits any changes (which
# triggers a Vercel deploy). Keyless auth via Workload Identity Federation.

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # avoid the busiest start-of-hour queue
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read Drive and log changes without writing/committing"
        type: boolean
        default: false
      force_qpdf_fallback:
        description: "Skip apt and use the pikepdf qpdf fallback (to test it)"
        type: boolean
        default: false

# Opt the JS-based actions into Node 24 (Node 20 is being deprecated).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Prevent overlapping runs from racing on the same commit.
concurrency:
  group: drive-sync
  cancel-in-progress: false

permissions:
  contents: write # commit synced content back to the repo
  id-token: write # mint the OIDC token for Workload Identity Federation

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to Google Cloud (keyless / WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1048877455007/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: drive-sync@ais-escp-website.iam.gserviceaccount.com

      - name: Install sync dependencies
        working-directory: ops/drive-sync
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/drive-sync/requirements.txt

      - name: Install PDF optimization tools
        run: |
          python -m pip install -r ops/drive-sync/requirements.txt
          # qpdf comes from apt. GitHub's runners sometimes cannot reach the Ubuntu package
          # servers (11 Nov 2026: DNS failures, the whole sync failed). Try apt twice with a
          # time limit; if it still fails, use pikepdf from PyPI (same qpdf library) through
          # ops/drive-sync/qpdf-fallback.py, so the sync never depends on Ubuntu's mirrors.
          for attempt in 1 2; do
            [ "${{ inputs.force_qpdf_fallback }}" = "true" ] && break
            if timeout 180 sudo apt-get update -qq -o Acquire::Retries=3 \
              && timeout 180 sudo apt-get install -y -o Acquire::Retries=3 qpdf; then
              break
            fi
            echo "::warning::apt could not install qpdf (attempt $attempt)"
            sleep 15
          done
          if ! command -v qpdf >/dev/null; then
            echo "::warning::Using the pikepdf fallback for qpdf"
            python -m pip install pikepdf==10.13.0.post1
            sudo install -m 755 ops/drive-sync/qpdf-fallback.py /usr/local/bin/qpdf
            sudo sed -i "1s|.*|#!$(command -v python)|" /usr/local/bin/qpdf
          fi
          # Smoke test the exact qpdf calls optimize-pdf.py makes, whichever qpdf is installed.
          python -c "import pymupdf; d = pymupdf.open(); d.new_page(); d.save('/tmp/qpdf-smoke.pdf')"
          qpdf --linearize --object-streams=generate --recompress-flate --compression-level=9 \
            --deterministic-id /tmp/qpdf-smoke.pdf /tmp/qpdf-smoke-out.pdf
          qpdf --check /tmp/qpdf-smoke-out.pdf
          echo "qpdf ready: $(command -v qpdf)"

      - name: Check PDF image optimization
        run: python -m unittest discover -s ops/drive-sync -p 'test_*.py'

      - name: Check publishing folder discovery
        run: node --test ops/drive-sync/sources.test.mjs

      - name: Run sync
        working-directory: ops/drive-sync
        run: node sync.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Write text versions of publications
        if: ${{ !inputs.dry_run }}
        run: python ops/drive-sync/extract_text.py

      - name: Commit changes
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "ais-drive-sync[bot]"
          git config user.email "ais-drive-sync@users.noreply.github.com"
          git add public src/data ops/drive-sync/pdf-cache.json
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Sync content from Google Drive [skip ci]"
            git push
          fi

      # Public repositories lose schedules after 60 days without activity.
      # A monthly heartbeat keeps publishing available between academic terms.
      - name: Keep scheduled publishing active during quiet periods
        if: ${{ !inputs.dry_run }}
        run: |
          last_commit=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last_commit )) -ge 2592000 ]; then
            date -u +%FT%TZ > ops/drive-sync/heartbeat.txt
            git add ops/drive-sync/heartbeat.txt
            git commit -m "Keep Drive publishing schedule active [skip ci]"
            git push
          fi
