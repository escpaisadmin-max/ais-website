<!doctype html>
<!--
  Source of public/social-preview.jpg and public/social-preview.png (the link preview card, 1200x630).
  Render from the repo root with headless Chrome:
    google-chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=/tmp/card.png scripts/social-preview/card.html
  then save public/social-preview.jpg (JPEG quality 85, keeps WhatsApp previews working) and public/social-preview.png,
  and bump the ?v= date on the image URL in src/data/pageMetadata.js so chat apps fetch the new card.
  Same photo and navy overlay as the homepage hero. Gelasio is metric compatible with Georgia, the site font (OFL, see fonts/OFL.txt).
-->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Gelasio;src:url("fonts/Gelasio[wght].ttf");font-weight:400 700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;font-family:Gelasio,Georgia,serif;-webkit-font-smoothing:antialiased}
.card{position:relative;width:1200px;height:630px;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 62%;transform:scale(1.12)}
.overlay{position:absolute;inset:0;background:rgba(30,51,96,.78)}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.content img{height:60px;margin-bottom:38px}
h1{font-size:64px;line-height:1.08;font-weight:700;color:#fff}
h1 span{display:block;color:#B7C8E8}
.url{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:21px;color:#D9D9D9}
</style></head><body><div class="card">
<img class="bg" src="../../public/london-skyline.jpg" alt="">
<div class="overlay"></div>
<div class="content"><img src="ais-logo-white.png" alt=""><h1>ESCP<span>Alternative Investment Society</span></h1></div>
<div class="url">escpais.com</div>
</div></body></html>
